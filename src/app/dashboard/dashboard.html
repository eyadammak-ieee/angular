<mat-card>
        <mat-card-title> Members </mat-card-title>
    <div class="chart-wrapper">
        
  <canvas baseChart
    [type]="'doughnut'"
    [datasets]="chartData"
    [labels]="chartLabels"
    [options]="chartOptions"
    >
  </canvas>
</div>

</mat-card>

<mat-card>
    <mat-card-title> Event Members </mat-card-title>
       <div class="chart-wrapper">
        
  <canvas baseChart
    [type]="'line'"
    [datasets]="chartDataLime"
    [labels]="chartLabelsLime"
    [options]="chartOptions"
    >
  </canvas>
  </div>
</mat-card>

<mat-card>
    <mat-card-title> Events </mat-card-title>
      <div class="chart-wrapper">
        
  <canvas baseChart
    [type]="'bar'"
    [datasets]="chartDataBar"
    [labels]="chartLabelsBar"
    [options]="chartOptions"
    >
  </canvas>
  </div>
</mat-card>
